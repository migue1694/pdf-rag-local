name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --name PDF_RAG_LOCAL pdf_rag_local.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF_RAG_LOCAL
          path: dist/PDF_RAG_LOCAL.exe
